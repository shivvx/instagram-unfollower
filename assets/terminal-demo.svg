<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 354" width="100%" height="354" fill="none">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="termBg" x1="0" y1="0" x2="860" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090c15" />
      <stop offset="100%" stop-color="#06070d" />
    </linearGradient>

    <linearGradient id="termBarGrad" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141826" />
      <stop offset="100%" stop-color="#0e121d" />
    </linearGradient>

    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }

      @keyframes progressShine {
        0% { opacity: 0.85; }
        50% { opacity: 1; }
        100% { opacity: 0.85; }
      }

      .cursor {
        animation: blinkCursor 0.9s infinite;
      }
      .anim-dot {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 818px 21px;
      }
      .anim-progress {
        animation: progressShine 3s ease-in-out infinite;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }
      .ui-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="1" y="1" width="858" height="352" rx="14" fill="url(#termBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M1 14C1 6.82 6.82 1 14 1H846C853.18 1 859 6.82 859 14V42H1V14Z" fill="url(#termBarGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="430" y="25" fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">
    instagram.com › Developer Tools › Console
  </text>

  <!-- Active Session Indicator Badge -->
  <g transform="translate(712, 11)">
    <rect width="126" height="22" rx="11" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" />
    <circle cx="14" cy="11" r="3.5" fill="#10b981" class="anim-dot" />
    <text x="26" y="15" fill="#10b981" font-size="10" font-weight="700" class="mono-text">SESSION ACTIVE</text>
  </g>

  <!-- ================= TERMINAL BODY ================= -->

  <!-- Command Line Prompt & Input -->
  <g transform="translate(30, 72)">
    <!-- Prompt symbol -->
    <text x="0" y="0" fill="#38bdf8" font-size="14" font-weight="800" class="mono-text">❯</text>

    <!-- Full, clean un-overlapping command text -->
    <text x="20" y="0" fill="#f8fafc" font-size="11.5" font-weight="500" class="mono-text">
      fetch('<tspan fill="#38bdf8">https://raw.githubusercontent.com/shivvx/instagram-unfollower/main/ghostgram.min.js</tspan>').then(r=&gt;r.text()).then(eval)
    </text>

    <!-- Blinking cursor placed AT THE END of command -->
    <rect x="796" y="-12" width="7" height="15" rx="1.5" fill="#818cf8" class="cursor" />
  </g>

  <!-- Execution Output Line 1 (Engine Load) -->
  <g transform="translate(30, 106)">
    <text x="0" y="0" fill="#10b981" font-size="12" font-weight="600" class="mono-text">
      [✓] GhostGram Engine v2.0 loaded successfully in 140ms
    </text>
  </g>

  <!-- Execution Output Line 2 (Anti-Ban Safety Shield) -->
  <g transform="translate(30, 128)">
    <text x="0" y="0" fill="#94a3b8" font-size="11.5" class="mono-text">
      [🛡️] Anti-Ban Jitter Shield: <tspan fill="#38bdf8" font-weight="700">ACTIVE</tspan> (Pacing: 1.5s - 3.0s) • 100% Client-Side • Residential IP
    </text>
  </g>

  <!-- Progress Bar Section -->
  <g transform="translate(30, 162)">
    <text x="0" y="0" fill="#cbd5e1" font-size="11.5" font-weight="600" class="mono-text">
      Scanning Relationship Graph: <tspan fill="#38bdf8">Followers vs. Following</tspan>
    </text>

    <!-- Progress Track -->
    <rect x="0" y="10" width="670" height="7" rx="3.5" fill="rgba(255,255,255,0.06)" />
    <!-- Progress Fill -->
    <rect x="0" y="10" width="670" height="7" rx="3.5" fill="url(#progressGrad)" class="anim-progress" />

    <text x="686" y="18" fill="#10b981" font-size="11" font-weight="800" class="mono-text">100% COMPLETE</text>
  </g>

  <!-- Telemetry Results Cards Row -->
  <g transform="translate(30, 206)">
    <!-- Card 1: Non-Followers -->
    <g transform="translate(0, 0)">
      <rect width="186" height="58" rx="10" fill="rgba(244,63,94,0.08)" stroke="rgba(244,63,94,0.3)" stroke-width="1" />
      <text x="14" y="20" fill="#fda4af" font-size="10" font-weight="700" class="ui-text">NON-FOLLOWERS</text>
      <text x="14" y="44" fill="#ffffff" font-size="20" font-weight="800" class="mono-text">48 <tspan fill="#f43f5e" font-size="12" font-weight="600">detected</tspan></text>
    </g>

    <!-- Card 2: Mutual Followers -->
    <g transform="translate(202, 0)">
      <rect width="186" height="58" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.3)" stroke-width="1" />
      <text x="14" y="20" fill="#6ee7b7" font-size="10" font-weight="700" class="ui-text">MUTUAL FOLLOWERS</text>
      <text x="14" y="44" fill="#ffffff" font-size="20" font-weight="800" class="mono-text">312 <tspan fill="#10b981" font-size="12" font-weight="600">mutual</tspan></text>
    </g>

    <!-- Card 3: Whitelist Shield -->
    <g transform="translate(404, 0)">
      <rect width="186" height="58" rx="10" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.3)" stroke-width="1" />
      <text x="14" y="20" fill="#fcd34d" font-size="10" font-weight="700" class="ui-text">⭐ WHITELIST SHIELD</text>
      <text x="14" y="44" fill="#ffffff" font-size="20" font-weight="800" class="mono-text">15 <tspan fill="#f59e0b" font-size="12" font-weight="600">protected</tspan></text>
    </g>

    <!-- Card 4: Safe Pacing -->
    <g transform="translate(606, 0)">
      <rect width="194" height="58" rx="10" fill="rgba(99,102,241,0.1)" stroke="rgba(129,140,248,0.3)" stroke-width="1" />
      <text x="14" y="20" fill="#c7d2fe" font-size="10" font-weight="700" class="ui-text">ANTI-BAN STATUS</text>
      <text x="14" y="44" fill="#38bdf8" font-size="15" font-weight="800" class="mono-text">Safe &amp; Protected</text>
    </g>
  </g>

  <!-- Overlay Ready Notice Banner -->
  <g transform="translate(30, 284)">
    <rect width="800" height="38" rx="8" fill="rgba(99,102,241,0.12)" stroke="rgba(129,140,248,0.35)" />
    <circle cx="20" cy="19" r="4" fill="#38bdf8" />
    <text x="34" y="23" fill="#f8fafc" font-size="12" font-weight="600" class="ui-text">
      ✨ <tspan fill="#38bdf8" font-weight="700">Obsidian Glass Dashboard mounted over Instagram.</tspan> Safe, interactive, and zero account risk.
    </text>
  </g>
</svg>
