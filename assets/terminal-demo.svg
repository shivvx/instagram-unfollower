<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="380" fill="none">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="termBg" x1="0" y1="0" x2="860" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>

    <linearGradient id="termBarGrad" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="100%" stop-color="#0f131f" />
    </linearGradient>

    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Keyframe Animations */
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Step timing over a 10s loop */
      @keyframes typeCommand {
        0%, 5% { width: 0; }
        30%, 95% { width: 560px; }
        100% { width: 0; }
      }

      @keyframes showOutput1 {
        0%, 32% { opacity: 0; transform: translateY(6px); }
        35%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }

      @keyframes showProgress {
        0%, 42% { opacity: 0; }
        45%, 95% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes fillProgress {
        0%, 45% { width: 0px; }
        68%, 95% { width: 440px; }
        100% { width: 0px; }
      }

      @keyframes showStats {
        0%, 68% { opacity: 0; transform: translateY(8px); }
        72%, 95% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; }
      }

      @keyframes showReady {
        0%, 80% { opacity: 0; transform: scale(0.96); }
        83%, 95% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; }
      }

      .cursor {
        animation: blinkCursor 0.9s infinite;
      }
      .anim-type-mask {
        animation: typeCommand 10s steps(45, end) infinite;
        overflow: hidden;
        white-space: nowrap;
      }
      .anim-out-1 {
        animation: showOutput1 10s ease-out infinite;
      }
      .anim-progress-box {
        animation: showProgress 10s ease-out infinite;
      }
      .anim-progress-fill {
        animation: fillProgress 10s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .anim-stats {
        animation: showStats 10s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .anim-ready {
        animation: showReady 10s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .ui-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="1" y="1" width="858" height="378" rx="14" fill="url(#termBg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M1 15C1 7.268 7.268 1 15 1H845C852.732 1 859 7.268 859 15V42H1V15Z" fill="url(#termBarGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="22" cy="21" r="6" fill="#ff5f56" />
  <circle cx="42" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="21" r="6" fill="#27c93f" />

  <!-- Title -->
  <g transform="translate(320, 26)">
    <text fill="#64748b" font-size="12" font-weight="600" text-anchor="middle" class="mono-text">
      instagram.com ❯ Developer Tools ❯ Console
    </text>
  </g>

  <!-- Active Session Indicator -->
  <g transform="translate(730, 14)">
    <rect width="112" height="20" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" />
    <circle cx="12" cy="10" r="3.5" fill="#10b981" />
    <text x="24" y="14" fill="#10b981" font-size="10" font-weight="700" class="mono-text">SESSION ACTIVE</text>
  </g>

  <!-- Terminal Content Area -->
  <g transform="translate(28, 72)">
    <!-- Prompt Line -->
    <text x="0" y="20" fill="#38bdf8" font-size="14" font-weight="700" class="mono-text">❯</text>

    <!-- Typing Text Container -->
    <g transform="translate(20, 5)">
      <!-- Typing Clip Mask -->
      <clipPath id="typeClip">
        <rect x="0" y="0" width="560" height="24" class="anim-type-mask" />
      </clipPath>

      <g clip-path="url(#typeClip)">
        <text x="0" y="15" fill="#f8fafc" font-size="13" font-weight="500" class="mono-text">
          fetch('<tspan fill="#38bdf8">https://instagram-unfollower.vercel.app/ghostgram.min.js</tspan>').then(r=&gt;r.text()).then(eval)
        </text>
      </g>
      <rect x="0" y="3" width="8" height="15" fill="#818cf8" class="cursor" />
    </g>

    <!-- Output Line 1: Injected Notice -->
    <g transform="translate(0, 50)" class="anim-out-1">
      <text x="0" y="0" fill="#10b981" font-size="13" font-weight="600" class="mono-text">
        [✓] GhostGram v2.0 Engine loaded successfully in 180ms
      </text>
      <text x="0" y="22" fill="#94a3b8" font-size="12" class="mono-text">
        [🛡️] Anti-Ban Jitter Shield: <tspan fill="#38bdf8">Active</tspan> (Interval: 1.5s - 3.2s) • Zero credentials transmitted
      </text>
    </g>

    <!-- Progress Bar Section -->
    <g transform="translate(0, 110)" class="anim-progress-box">
      <text x="0" y="0" fill="#cbd5e1" font-size="12" font-weight="600" class="mono-text">
        Scanning Relationship Graph: <tspan fill="#38bdf8">Followers vs. Following</tspan>
      </text>

      <!-- Track -->
      <rect x="0" y="12" width="440" height="8" rx="4" fill="rgba(255,255,255,0.06)" />
      <!-- Animated Fill -->
      <rect x="0" y="12" width="0" height="8" rx="4" fill="url(#progressGrad)" class="anim-progress-fill" />

      <text x="456" y="20" fill="#38bdf8" font-size="11" font-weight="700" class="mono-text">100% COMPLETE</text>
    </g>

    <!-- Results / Telemetry Summary Cards -->
    <g transform="translate(0, 160)" class="anim-stats">
      <!-- Card 1: Non-Followers -->
      <g transform="translate(0, 0)">
        <rect width="180" height="64" rx="10" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.35)" />
        <text x="14" y="22" fill="#fda4af" font-size="10" font-weight="700" class="ui-text">NON-FOLLOWERS</text>
        <text x="14" y="48" fill="#ffffff" font-size="22" font-weight="800" class="mono-text">48 <tspan fill="#f43f5e" font-size="13" font-weight="600">accounts</tspan></text>
      </g>

      <!-- Card 2: Mutual Followers -->
      <g transform="translate(196, 0)">
        <rect width="180" height="64" rx="10" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.35)" />
        <text x="14" y="22" fill="#6ee7b7" font-size="10" font-weight="700" class="ui-text">MUTUAL FOLLOWERS</text>
        <text x="14" y="48" fill="#ffffff" font-size="22" font-weight="800" class="mono-text">312 <tspan fill="#10b981" font-size="13" font-weight="600">verified</tspan></text>
      </g>

      <!-- Card 3: Whitelist Shield -->
      <g transform="translate(392, 0)">
        <rect width="180" height="64" rx="10" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.35)" />
        <text x="14" y="22" fill="#fcd34d" font-size="10" font-weight="700" class="ui-text">⭐ WHITELIST SHIELD</text>
        <text x="14" y="48" fill="#ffffff" font-size="22" font-weight="800" class="mono-text">15 <tspan fill="#f59e0b" font-size="13" font-weight="600">protected</tspan></text>
      </g>

      <!-- Card 4: Action Ready -->
      <g transform="translate(588, 0)">
        <rect width="210" height="64" rx="10" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.35)" />
        <text x="14" y="22" fill="#c7d2fe" font-size="10" font-weight="700" class="ui-text">EXPORT &amp; CLEAN</text>
        <text x="14" y="48" fill="#38bdf8" font-size="14" font-weight="700" class="ui-text">Ready for CSV Export</text>
      </g>
    </g>

    <!-- Overlay Mounted Banner Badge -->
    <g transform="translate(0, 244)" class="anim-ready">
      <rect width="798" height="42" rx="8" fill="rgba(99,102,241,0.15)" stroke="rgba(129,140,248,0.4)" stroke-dasharray="4 4" />
      <text x="16" y="26" fill="#f8fafc" font-size="13" font-weight="600" class="ui-text">
        ✨ <tspan fill="#38bdf8" font-weight="700">Obsidian Glass Dashboard mounted directly over Instagram.</tspan> Safe, interactive, and zero account risk.
      </text>
    </g>
  </g>
</svg>
