<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="160" fill="none">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101424" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      @keyframes travelPulse {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: travelPulse 2s linear infinite;
      }
      .step-1 { animation: floatCard 4s ease-in-out infinite 0s; }
      .step-2 { animation: floatCard 4s ease-in-out infinite 0.8s; }
      .step-3 { animation: floatCard 4s ease-in-out infinite 1.6s; }
      .step-4 { animation: floatCard 4s ease-in-out infinite 2.4s; }
      .step-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono-kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; }
    </style>
  </defs>

  <!-- Connecting Animated Power Lines between Steps -->
  <line x1="180" y1="80" x2="230" y2="80" stroke="url(#lineGrad)" stroke-width="2.5" class="pulse-line" stroke-linecap="round" />
  <polygon points="230,76 238,80 230,84" fill="#a855f7" />

  <line x1="390" y1="80" x2="440" y2="80" stroke="url(#lineGrad)" stroke-width="2.5" class="pulse-line" stroke-linecap="round" />
  <polygon points="440,76 448,80 440,84" fill="#a855f7" />

  <line x1="600" y1="80" x2="650" y2="80" stroke="url(#lineGrad)" stroke-width="2.5" class="pulse-line" stroke-linecap="round" />
  <polygon points="650,76 658,80 650,84" fill="#38bdf8" />

  <!-- Step 1 Card -->
  <g transform="translate(10, 20)" class="step-1">
    <rect width="170" height="120" rx="14" fill="url(#stepGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="rgba(99,102,241,0.2)" stroke="rgba(129,140,248,0.5)" />
    <text x="28" y="35" fill="#818cf8" font-size="12" font-weight="800" text-anchor="middle" class="mono-kbd">01</text>
    <text x="50" y="34" fill="#ffffff" font-size="14" font-weight="700" class="step-text">Instagram</text>
    <text x="16" y="66" fill="#94a3b8" font-size="11" line-height="1.4" class="step-text">Open browser tab</text>
    <rect x="16" y="78" width="138" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" />
    <text x="85" y="94" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="mono-kbd">instagram.com</text>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(220, 20)" class="step-2">
    <rect width="170" height="120" rx="14" fill="url(#stepGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="rgba(168,85,247,0.2)" stroke="rgba(192,132,252,0.5)" />
    <text x="28" y="35" fill="#c084fc" font-size="12" font-weight="800" text-anchor="middle" class="mono-kbd">02</text>
    <text x="50" y="34" fill="#ffffff" font-size="14" font-weight="700" class="step-text">Open Console</text>
    <text x="16" y="66" fill="#94a3b8" font-size="11" class="step-text">Press Shortcut key</text>
    <g transform="translate(16, 78)">
      <rect width="44" height="24" rx="6" fill="#1c2136" stroke="rgba(255,255,255,0.2)" />
      <text x="22" y="16" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" class="mono-kbd">F12</text>
      <text x="56" y="16" fill="#64748b" font-size="10" class="step-text">or ⌘+⌥+I</text>
    </g>
  </g>

  <!-- Step 3 Card -->
  <g transform="translate(430, 20)" class="step-3">
    <rect width="170" height="120" rx="14" fill="url(#stepGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="rgba(56,189,248,0.2)" stroke="rgba(56,189,248,0.5)" />
    <text x="28" y="35" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle" class="mono-kbd">03</text>
    <text x="50" y="34" fill="#ffffff" font-size="14" font-weight="700" class="step-text">Paste Snippet</text>
    <text x="16" y="66" fill="#94a3b8" font-size="11" class="step-text">Paste into prompt</text>
    <g transform="translate(16, 78)">
      <rect width="138" height="24" rx="6" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" />
      <text x="69" y="16" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" class="mono-kbd">Press [Enter] ↵</text>
    </g>
  </g>

  <!-- Step 4 Card -->
  <g transform="translate(640, 20)" class="step-4">
    <rect width="210" height="120" rx="14" fill="url(#stepGrad)" stroke="rgba(16,185,129,0.35)" stroke-width="1.5" />
    <circle cx="28" cy="30" r="14" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.5)" />
    <text x="28" y="35" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle" class="mono-kbd">04</text>
    <text x="50" y="34" fill="#ffffff" font-size="14" font-weight="700" class="step-text">Audit Dashboard</text>
    <text x="16" y="66" fill="#94a3b8" font-size="11" class="step-text">Sleek obsidian glass mounts</text>
    <g transform="translate(16, 78)">
      <rect width="178" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" />
      <text x="89" y="16" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" class="step-text">⚡ 100% Safe • Anti-Ban</text>
    </g>
  </g>
</svg>
