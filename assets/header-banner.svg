<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111d" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="860" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatGhost {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-2deg); }
      }
      @keyframes scanBeam {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes textShine {
        0% { stop-color: #818cf8; }
        50% { stop-color: #38bdf8; }
        100% { stop-color: #c084fc; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .anim-glow {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-ghost {
        animation: floatGhost 4s ease-in-out infinite;
        transform-origin: 90px 130px;
      }
      .anim-scan {
        animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .anim-dot {
        animation: blinkDot 1.8s ease-in-out infinite;
      }
      .banner-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      .mono-font {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="858" height="258" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <g filter="url(#blurFilter)" class="anim-glow">
    <circle cx="160" cy="110" r="80" fill="#6366f1" opacity="0.4" />
    <circle cx="700" cy="140" r="90" fill="#38bdf8" opacity="0.3" />
    <circle cx="430" cy="200" r="70" fill="#a855f7" opacity="0.25" />
  </g>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="52" x2="860" y2="52" />
    <line x1="0" y1="104" x2="860" y2="104" />
    <line x1="0" y1="156" x2="860" y2="156" />
    <line x1="0" y1="208" x2="860" y2="208" />
    <line x1="172" y1="0" x2="172" y2="260" />
    <line x1="344" y1="0" x2="344" y2="260" />
    <line x1="516" y1="0" x2="516" y2="260" />
    <line x1="688" y1="0" x2="688" y2="260" />
  </g>

  <!-- Animated Top Edge Scan Light -->
  <rect x="0" y="0" width="300" height="2" fill="url(#glowGrad)" class="anim-scan" />

  <!-- Ghost Icon (Animated Floating) -->
  <g class="anim-ghost">
    <!-- Icon Container -->
    <rect x="52" y="72" width="76" height="76" rx="22" fill="#121626" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
    <g transform="translate(62, 82) scale(1.15)">
      <path d="M24 8C16.268 8 10 14.268 10 22V36C10 37.3 11.6 38.1 12.7 37.2L16 34.5L19.3 37.2C20.3 38 21.7 38 22.7 37.2L24 36.2L25.3 37.2C26.3 38 27.7 38 28.7 37.2L32 34.5L35.3 37.2C36.4 38.1 38 37.3 38 36V22C38 14.268 31.732 8 24 8Z" fill="url(#brandGrad)" />
      <ellipse cx="18.5" cy="20.5" rx="2.4" ry="3.2" fill="#08090f" />
      <ellipse cx="29.5" cy="20.5" rx="2.4" ry="3.2" fill="#08090f" />
      <circle cx="19.5" cy="19.5" r="0.9" fill="#ffffff" />
      <circle cx="30.5" cy="19.5" r="0.9" fill="#ffffff" />
    </g>
  </g>

  <!-- Status Eyebrow Pill -->
  <g transform="translate(150, 52)">
    <rect x="0" y="0" width="280" height="26" rx="13" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10b981" class="anim-dot" />
    <circle cx="14" cy="13" r="7" fill="none" stroke="#10b981" opacity="0.4" class="anim-dot" />
    <text x="28" y="17" fill="#10b981" font-size="11" font-weight="700" letter-spacing="0.5" class="banner-font">100% CLIENT-SIDE • ZERO PASSWORDS REQUIRED</text>
  </g>

  <!-- Main Title -->
  <text x="150" y="122" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-1" class="banner-font">
    GhostGram
    <tspan fill="url(#brandGrad)"> v2.0</tspan>
  </text>

  <!-- Subtitle -->
  <text x="150" y="152" fill="#94a3b8" font-size="15" font-weight="500" class="banner-font">
    Next-Gen Instagram Relationship Analyzer &amp; Follower Intelligence Engine
  </text>

  <!-- Feature Badge Pills Row -->
  <g transform="translate(150, 180)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="28" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-size="12" font-weight="600" class="banner-font">🛡️ Anti-Ban Rate Shield</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(176, 0)">
      <rect x="0" y="0" width="162" height="28" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="10" y="18" fill="#fcd34d" font-size="12" font-weight="600" class="banner-font">⭐ 1-Click VIP Whitelist</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(346, 0)">
      <rect x="0" y="0" width="158" height="28" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="10" y="18" fill="#a78bfa" font-size="12" font-weight="600" class="banner-font">📊 CSV &amp; JSON Export</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(512, 0)">
      <rect x="0" y="0" width="166" height="28" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="10" y="18" fill="#34d399" font-size="12" font-weight="600" class="banner-font">⚡ Instant In-Tab Overlay</text>
    </g>
  </g>

  <!-- Author Tag in Corner -->
  <g transform="translate(700, 226)">
    <text x="135" y="15" fill="#64748b" font-size="11" font-weight="500" text-anchor="end" class="banner-font">
      Crafted by <tspan fill="#818cf8" font-weight="700">Shivvx</tspan> · <tspan fill="#38bdf8">wiroxa.dev</tspan>
    </text>
  </g>
</svg>
